<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Градиенты во всю ширину круга: переход цвета виден на каждой половине. -->
    <linearGradient id="cool" gradientUnits="userSpaceOnUse" x1="40" y1="28" x2="180" y2="228">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.35" stop-color="#3D7BFF"/>
      <stop offset="0.7" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#2A0A7A"/>
    </linearGradient>
    <linearGradient id="warm" gradientUnits="userSpaceOnUse" x1="216" y1="28" x2="76" y2="228">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="0.35" stop-color="#FF8A3D"/>
      <stop offset="0.7" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#B0136E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="0.5" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B1240" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="128" cy="128" r="104" fill="url(#ring)"/>
    <circle cx="128" cy="128" r="100" fill="url(#warm)"/>
    <path d="M128,28 A100,100 0 0,0 128,228 A50,50 0 0,0 128,128 A50,50 0 0,1 128,28 Z" fill="url(#cool)"/>
    <circle cx="128" cy="128" r="100" fill="url(#gloss)"/>
    <circle cx="128" cy="178" r="15" fill="#FF7A3D"/>
    <circle cx="128" cy="78" r="15" fill="#3D7BFF"/>
  </g>
</svg>
